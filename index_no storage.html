<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSU Status Update</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#333333">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 8px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h2, h3 {
            color: #333;
            margin-top: 0;
            margin-bottom: 10px;
        }
        h3 { font-size: 1.1rem; }

        /* === NEW: Container for Chimp + Buttons === */
        .header-content {
            display: flex; /* Arrange items horizontally */
            align-items: center; /* Vertically align items */
            gap: 15px; /* Space between chimp and buttons */
            margin-bottom: 15px;
        }

        /* === NEW: Chimp Icon Style === */
        .chimp-icon {
            width: 50px; /* Adjust size as needed */
            height: 50px;
            fill: #001f3f; /* Navy Blue */
            flex-shrink: 0; /* Prevent chimp from shrinking */
        }

        /* Modified: Button group now takes remaining space */
        .button-group {
            display: flex;
            flex-grow: 1; /* Allow button group to fill available space */
            gap: 8px;
            /* Removed margin-bottom, handled by header-content */
        }
        .button-group button {
             flex: 1; /* Make buttons equal width within the group */
             min-width: 0;
             /* Removed max-width */
         }


        .utility-button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-weight: bold;
            margin-bottom: 4px;
            color: #333;
            font-size: 0.9rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-row-4col {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 6px;
        }
        .form-row-4col .form-group label {
            font-size: 0.8rem;
        }

        .input-group {
            display: flex;
        }
        .input-group-text {
            padding: 8px 10px;
            background-color: #eee;
            border: 1px solid #ccc;
            border-right: none;
            border-radius: 5px 0 0 5px;
            font-weight: bold;
            color: #555;
            font-size: 0.95rem;
        }
        .input-group input {
            border-radius: 0 5px 5px 0 !important;
            flex-grow: 1;
        }

        .input-with-button {
            display: flex;
            gap: 8px;
        }
        .input-with-button input {
            flex-grow: 1;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        textarea {
            width: 100%;
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        .form-row-4col input {
            padding: 8px 6px;
            font-size: 0.9rem;
        }

        /* Base button styles */
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 8px 12px;
            margin-top: 2px;
            border-radius: 5px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .button-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }

        button:hover {
            background-color: #004175;
        }

        #submitBtn {
            background-color: #28a745;
            font-size: 0.95rem;
            padding: 10px 15px;
            width: 100%; /* Explicit full width */
        }
        #submitBtn:hover {
            background-color: #218838;
        }

        .shortcut-btn {
            flex-shrink: 0;
            width: auto;
            padding: 0 12px;
            background-color: #6c757d;
            font-size: 0.85rem;
            margin-top: 0;
        }
        .shortcut-btn:hover {
            background-color: #5a6268;
        }

        .copy-btn {
            background-color: #007bff;
        }
        .copy-btn:hover {
            background-color: #0069d9;
        }

        .btn-secondary {
            background-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .btn-danger {
            background-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }

        textarea {
            width: 100%;
            min-height: 70px;
        }
        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header-content">
            <svg class="chimp-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <path d="M50,10 C30,10 15,25 15,45 C15,65 30,80 50,80 C70,80 85,65 85,45 C85,25 70,10 50,10 Z M50,15 C66.5,15 80,28.5 80,45 C80,61.5 66.5,75 50,75 C33.5,75 20,61.5 20,45 C20,28.5 33.5,15 50,15 Z"/>
              <path d="M35,35 C32,35 30,37 30,40 C30,43 32,45 35,45 C38,45 40,43 40,40 C40,37 38,35 35,35 Z"/>
              <path d="M65,35 C62,35 60,37 60,40 C60,43 62,45 65,45 C68,45 70,43 70,40 C70,37 68,35 65,35 Z"/>
              <path d="M50,55 C45,55 40,58 40,62 C40,66 45,68 50,68 C55,68 60,66 60,62 C60,58 55,55 50,55 Z M50,58 C53,58 57,59.5 57,62 C57,64.5 53,65 50,65 C47,65 43,64.5 43,62 C43,59.5 47,58 50,58 Z"/>
              <path d="M30,50 C35,52 40,52 40,50 C40,48 35,48 30,50 Z"/>
              <path d="M70,50 C65,52 60,52 60,50 C60,48 65,48 70,50 Z"/>
            </svg>

            <div class="button-group">
              	<button id="btnShowRcf">
                    <img src="rcf-icon.png" alt="" class="button-icon">
                    RCF - Received from Flight
                </button>
              	<button id="btnShowDlv">
                    <img src="dlv-icon.png" alt="" class="button-icon">
                    DLV - Delivered
                </button>
            </div>
        </div>
        <hr>

        <form id="statusForm">
                  	<div id="commonFields" style="display: none;">
                <div class="form-group">
                  	<label for="awb">AWB:</label>
                  	<input type="text" id="awb" name="awb" placeholder="NNN-NNNNNNNN" maxlength="12">
                </div>
                <div class="form-row-4col">
                    <div class="form-group">
                      	<label for="origin">Origin:</label>
                      	<input type="text" id="origin" name="origin" value="WAW" maxlength="3">
                    </div>
                    <div class="form-group">
                      	<label for="destination">Dest:</label>
                      	<input type="text" id="destination" name="destination" value="TBS" maxlength="3">
                    </div>
                    <div class="form-group">
                      	<label for="totalPieces">Pieces:</label>
                      	<input type="number" id="totalPieces" name="totalPieces" max="9999">
                    </div>
                    <div class="form-group">
                      	<label for="totalWeight">Weight:</label>
                      	<input type="number" id="totalWeight" name="totalWeight" max="9999">
                    </div>
                </div>
          	</div>

            <div id="utilityButtons" class="utility-button-group" style="display: none;">
                <button type="button" id="btnClearAwb" class="btn-secondary">Clear AWB details</button>
                <button type="button" id="btnClearAll" class="btn-danger">Clear All</button>
            </div>

          	<div id="rcfFields" style="display: none;">
              	<h3 style="color: red; font-weight: bold;">RECEIVED FROM FLIGHT</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label for="flight">Flight</label>
                        <div class="input-group">
                            <span class="input-group-text">LO</span>
                            <input type="text" id="flight" name="flight" placeholder="Flight" maxlength="4">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="arrivalPort">Port:</label>
                        <input type="text" id="arrivalPort" name="arrivalPort" value="TBS" maxlength="3">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                      	<label for="arrivalDate">Date:</label>
                        <div class="input-with-button">
                      	    <input type="date" id="arrivalDate" name="arrivalDate">
                            <button type="button" id="arrivalDateToday" class="shortcut-btn">Today</button>
                        </div>
                    </div>
                    <div class="form-group">
                      	<label for="arrTime">Time:</label>
                        <div class="input-with-button">
                      	    <input type="time" id="arrTime" name="arrTime">
                            <button type="button" id="arrTimeNow" class="shortcut-btn">Now</button>
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                      	<label for="arrivedPieces">ARRIVED PIECES:</label>
                        <div class="input-with-button">
                      	    <input type="number" id="arrivedPieces" name="arrivedPieces" max="999">
                            <button type="button" id="copyArrivedPiecesBtn" class="shortcut-btn copy-btn">Copy</button>
                        </div>
                    </div>
                    <div class="form-group">
                      	<label for="arrivedWeight">ARRIVED WEIGHT:</label>
                        <div class="input-with-button">
                      	    <input type="number" id="arrivedWeight" name="arrivedWeight" max="9999">
                            <button type="button" id="copyArrivedWeightBtn" class="shortcut-btn copy-btn">Copy</button>
                        </div>
                    </div>
                </div>
              	<button type="button" id="btnGenRcf">Generate Output</button>
          	</div>

          	<div id="dlvFields" style="display: none;">
              	<h3 style="color: red; font-weight: bold;">PICK-UP AND DELIVERY</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label for="pickupDate">Pick-up Date:</label>
                        <div class="input-with-button">
                            <input type="date" id="pickupDate" name="pickupDate">
                            <button type="button" id="pickupDateToday" class="shortcut-btn">Today</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="pickupTime">Pick Up time:</label>
                        <div class="input-with-button">
                            <input type="time" id="pickupTime" name="pickupTime">
                            <button type="button" id="pickupTimeNow" class="shortcut-btn">Now</button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="pickupPort">Port:</label>
                    <input type="text" id="pickupPort" name="pickupPort" value="TBS" maxlength="3">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="deliveredPieces">DELIVERED PIECES:</label>
                        <div class="input-with-button">
                            <input type="number" id="deliveredPieces" name="deliveredPieces" max="999">
                            <button type="button" id="copyDeliveredPiecesBtn" class="shortcut-btn copy-btn">Copy</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="deliveredWeight">DELIVERED WEIGHT:</label>
                        <div class="input-with-button">
                            <input type="number" id="deliveredWeight" name="deliveredWeight" max="9999">
                            <button type="button" id="copyDeliveredWeightBtn" class="shortcut-btn copy-btn">Copy</button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="pickedUpBy">Picked up by:</label>
                    <input type="text" id="pickedUpBy" name="pickedUpBy" maxlength="20">
                </div>
              	<button type="button" id="btnGenDlv">Generate Output</button>
          	</div>
        </form>

      	<div id="outputContainer" style="display: none;">
          	<hr>
          	<h2>Plain Text Output</h2>
            <div class="form-group">
                <label for="outputText">Message:</label>
        	   	<textarea id="outputText" rows="5"></textarea>
            </div>
          	<button id="submitBtn" type="button" style="display: none;">SUBMIT</button>
      	</div>
    </div>

    <script src="app.js"></script>

</body>
</html>
